name: Build Breivik Default inventory
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare_breivik_default.py
      - .github/workflows/build-breivik-default.yml
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas shapely
      - name: Download official Breivik Default archive
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o Default.zip https://projects.nilu.no/globalpcb/download/1205.zip
          echo '02d821c09c7629d2fd3a83688d58828fe9795636ab3010f0fc517a5cd7d1b29d  Default.zip' | sha256sum -c -
      - name: Rebuild with exact published country geometry
        run: python scripts/prepare_breivik_default.py --zip Default.zip --scenario Default --boundaries data/boundaries/world_india.geojson --out data/breivik/default
      - name: Verify all 23 published files
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('data/breivik/default')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['pollutants'])==23
          for k,v in m['pollutants'].items():
              f=p/(k+'.json')
              x=json.loads(f.read_text())
              assert x['pollutant']==k and x['records'],k
          print('Verified all 23 Breivik datasets and manifest')
          PY
      - name: Commit validated country-year datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/breivik/default
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated Breivik Default PCB inventory using exact atlas boundaries"
            git push
          fi
