name: Sync EDGAR POPs inventories
on:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * 1'
permissions:
  contents: write
concurrency:
  group: edgar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/edgar-dependencies.txt
      - name: Install synchronizer dependencies
        run: pip install -r scripts/edgar-dependencies.txt
      - name: Validate sector mapping regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Fetch, verify and preprocess official EDGAR v8.1 inventories
        run: python scripts/sync_edgar.py
      - name: Detect dataset changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- data/edgar)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit updated datasets
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edgar
          git commit -m "data: update official EDGAR POPs annual inventories"
          git push
